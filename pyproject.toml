[project]
name = "MeteoSwiss Rain Radar"
version = "0.1.3"
description = "Custom Home Assistant component for MeteoSwiss rain radar"
maintainers = [
  { name = "Remo", email = "deltaecho07@gmail.com" },
]

requires-python = ">=3.12,<4.0"
dependencies = ["homeassistant"]
license = "Apache-2.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
